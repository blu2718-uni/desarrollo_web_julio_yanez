<!DOCTYPE html>
<html lang="es">
    <head>
        <title>Entradas</title>
        <link rel="stylesheet" type="text/css" href="./style.css">
    </head>
    <body>
      <h1>Entradas</h1>

      <label for="filtro-tipo">Filtrar por actividad:</label>
      <select name="filtro-tipo" id="filtro-tipo" onchange="filtradoTabla()">
        <option value="">Todos los tipos</option>
        <option value="deportiva">Deportiva</option>
        <option value="recreativa">Recreativa</option>
        <option value="artística">Artística</option>
        <option value="social">Social</option>
        <option value="tecnológica">Tecnológica</option>
        <option value="otro">Otro</option>
      </select>

      <div id="paginas"></div>
      
      <table id="entradas">
        <thead class="entradas-encabezado" id="entradas-encabezado">
          <tr>
            <th onclick="ordenarTabla(0)">Nombre</th>
            <th onclick="ordenarTabla(1)">Correo</th>
            <th onclick="ordenarTabla(2)">Rol</th>
            <th onclick="ordenarTabla(3)">Nombre de la actividad</th>
            <th onclick="ordenarTabla(4)">Tipo de actividad</th>
            <th onclick="sortTable(5)">Fecha de la actividad</th>
            <th onclick="sortTable(6)">Duración de la actividad</th>
            <th>Enlace relacionado</th>
          </tr>
        </thead>
        <tbody class="entradas-datos" id="entradas-datos">
        </tbody>
      </table>

      <script src="entradas.js"></script>
    </body>
</html>
