<!DOCTYPE html>
<html lang="es">
    <head>
        <title>Entradas</title>
        <link rel="stylesheet" type="text/css" href="css/style.css">
    </head>
    <body>
      <h1 class="titulo" id="titulo-entradas">Entradas</h1>
        <button type="button" class="a-index-universal" id="a-index-por-entradas" onclick="window.location.href = './index.html'">Regresar a la página principal</button>
      <label class="input-label" for="filtro-tipo"><h2>Filtrar por actividad:</h2></label>
      
      <select class="input-select" name="filtro-tipo" id="filtro-tipo" onchange="filtradoTabla()">
        <option value="">Todos los tipos</option>
        <option value="deportiva">Deportiva</option>
        <option value="recreativa">Recreativa</option>
        <option value="artística">Artística</option>
        <option value="social">Social</option>
        <option value="tecnológica">Tecnológica</option>
        <option value="otro">Otro</option>
      </select>

      <div class="selecion-pagina" id="paginas"></div>
      
      <table class="tabla" id="entradas">
        <thead class="encabezado-tablas" id="entradas-encabezado">
          <tr>
            <th onclick="ordenarTabla(0)">Nombre</th>
            <th onclick="ordenarTabla(1)">Correo</th>
            <th onclick="ordenarTabla(2)">Rol</th>
            <th onclick="ordenarTabla(3)">Nombre de la actividad</th>
            <th onclick="ordenarTabla(4)">Tipo de actividad</th>
            <th onclick="ordenarTabla(5)">Fecha de la actividad</th>
          </tr>
        </thead>
        <tbody class="datos-tablas" id="entradas-datos">
        </tbody>
      </table>
      <div class="extra-info" id="info-de-dato"></div>
      <script src="js/entradas.js"></script>
    </body>
</html>
