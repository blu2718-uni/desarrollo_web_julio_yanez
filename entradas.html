<!DOCTYPE html>
<html>
    <head>
        <title></title>
        <link rel="stylesheet" type="text/css" href="./style.css">
        </style>
    </head>
    <body>
        <h1>entradas</h1>

      <table id="entradas">
        <thead id="entradas-encabezado">
        <tr>
          <th>Nombre</th>
          <th>Correo</th>
          <th>Rol</th>
          <th>Nombre de la actividad</th>
          <th>Tipo de actividad</th>
          <th>Fecha de la actividad</th>
          <th>Duración de la actividad</th>
          <th>Enlace relacionado</th>
        </tr>
        </thead>
        <tbody id="entradas-datos">

        </tbody>
      </table>

      <label for="tipo">Filtrar por actividad:</label>
      <select name="tipo" id="filtro-tipo" onchange="filtradoTabla()">
        <option value="">Todos los tipos</option>
        <option value="deportiva">Deportiva</option>
        <option value="recreativa">Recreativa</option>
        <option value="artística">Artística</option>
        <option value="social">Social</option>
        <option value="tecnológica">Tecnológica</option>
        <option value="otro">Otro</option>
      </select>

      <div id="paginas"></div>
      <script src="entradas.js"></script>
    </body>
</html>
